services:
  mysql:
    image: mysql:8.0
    container_name: flight_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: flight_intelligence
      # Lida pelo 03_readonly_user.sh para criar o usuario da aplicacao.
      MYSQL_READONLY_PASSWORD: ${MYSQL_READONLY_PASSWORD}
    ports:
      - "3307:3306"   # 3307 no host para nao conflitar com um MySQL local ja rodando
    volumes:
      - mysql_data:/var/lib/mysql
      # Prefixo numerico porque o entrypoint do MySQL executa os arquivos de
      # /docker-entrypoint-initdb.d em ORDEM ALFABETICA: o dump tem que criar
      # as tabelas antes de qualquer UPDATE ou GRANT tocar nelas.
      - ./database/flight_intelligence_dump.sql:/docker-entrypoint-initdb.d/01_dump.sql:ro
      - ./database/airport_names.sql:/docker-entrypoint-initdb.d/02_airport_names.sql:ro
      - ./database/03_readonly_user.sh:/docker-entrypoint-initdb.d/03_readonly_user.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: flight_backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      # A API conecta com um usuario que SO' tem SELECT nas 5 tabelas Gold:
      # mesmo que o validador de SQL do agente falhe, nao ha' como escrever.
      # O healthcheck do MySQL continua com root, que e' outro contexto.
      DB_USER: flight_reader
      DB_PASSWORD: ${MYSQL_READONLY_PASSWORD}
      DB_NAME: flight_intelligence
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: flight_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
